# Policy for `cargo deny check`. Without this file every crate is refused, since the default
# allow list is empty.

[licenses]
# Every licence the tree actually carries, all permissive and all compatible with releasing
# this project under MIT or Apache-2.0. A dependency arriving under anything else stops the
# check rather than being waved through.
allow = [
    "Apache-2.0",
    # Apache-2.0 with a patent grant that only widens it, which wasmtime and cranelift carry.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# A crate offered under several licences is taken under the first of these it allows, so an
# `Apache-2.0 OR LGPL-2.1-or-later OR MIT` crate is taken under Apache-2.0, never the copyleft one.
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
# Both arrive through sled, which has had no release since 2021 and is the standalone cache's
# known cost. Neither has a fix to upgrade to, and anything new still fails the check.
ignore = [
    "RUSTSEC-2025-0057", # fxhash, unmaintained, via sled
    "RUSTSEC-2024-0384", # instant, unmaintained, via sled -> parking_lot 0.11
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
