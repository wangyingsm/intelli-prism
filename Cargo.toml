[package]
name = "intelli-prism"
version.workspace = true
edition.workspace = true

[dependencies]
axum = "0.8.9"
http-body-util = "0.1.5"
ip-auth = { version = "0.1.0", path = "crates/ip-auth" }
ip-config = { version = "0.1.0", path = "crates/ip-config" }
ip-core = { version = "0.1.0", path = "crates/ip-core" }
ip-gateway = { version = "0.1.0", path = "crates/ip-gateway" }
ip-plugin = { version = "0.1.0", path = "crates/ip-plugin" }
ip-storage = { version = "0.1.0", path = "crates/ip-storage" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ip-core = { path = "crates/ip-core" }

[dev-dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
http-body-util = "0.1.5"
serde_json = "1.0.151"
tower = "0.5.3"
wat = "1.259.0"
