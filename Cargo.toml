[package]
name = "intelli-prism"
description = "An enterprise AI proxy and gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["llm", "ai", "proxy", "gateway"]
categories = ["network-programming", "web-programming::http-server"]

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
getrandom.workspace = true
http-body-util = "0.1.5"
ip-auth = { version = "0.1.0", path = "crates/ip-auth" }
ip-cache = { version = "0.1.0", path = "crates/ip-cache", default-features = false }
ip-config = { version = "0.1.0", path = "crates/ip-config" }
ip-core = { version = "0.1.0", path = "crates/ip-core" }
ip-gateway = { version = "0.1.0", path = "crates/ip-gateway" }
ip-plugin = { version = "0.1.0", path = "crates/ip-plugin" }
ip-storage = { version = "0.1.0", path = "crates/ip-storage", default-features = false }
rpassword = "7.5.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zeroize.workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["wangy <yingge_gzb@qq.com>"]

[workspace.dependencies]
getrandom = "0.4.3"
hex = "0.4.3"
ip-core = { path = "crates/ip-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = "1.9.0"

[dev-dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
http-body-util = "0.1.5"
ip-cache = { version = "0.1.0", path = "crates/ip-cache", features = ["standalone-cache", "testing"] }
ip-storage = { version = "0.1.0", path = "crates/ip-storage", features = ["standalone-storage", "testing"] }
serde_json.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tower = "0.5.3"
wat = "1.259.0"

[features]
default = ["fast-storage", "cluster-cache"]
standalone-storage = ["ip-storage/standalone-storage"]
fast-storage = ["ip-storage/fast-storage"]
standalone-cache = ["ip-cache/standalone-cache"]
cluster-cache = ["ip-cache/cluster-cache"]
