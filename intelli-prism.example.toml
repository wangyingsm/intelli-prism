# Copy to intelli-prism.toml and edit. Every key is rejected if misspelled, so a
# typo stops the server rather than silently taking a default.
#
# The gateway keeps /_ip for its own endpoints: /_ip/healthz and /_ip/whoami. No
# routing rule may claim a path under it. Every other path is proxied.

[server]
listen = "127.0.0.1:8080"

# Standalone deployment. The file is created and migrated on first start.
[storage]
backend = "sqlite"
path = "./intelli-prism.db"

# Cluster deployment uses postgres instead, which only a build with the fast-storage
# feature serves (cargo build --features fast-storage):
# [storage]
# backend = "postgres"
# url = "postgres://intelli_prism:secret@localhost/intelli_prism"

# Cluster deployment. Every node shares one redis, which is what a nonce spent on
# one node needs to be spent on all of them.
[cache]
backend = "redis"
url = "redis://localhost:6379"
# Seconds an answered request stays cached, so the same tenant asking the same route the
# same thing is answered without calling the upstream. Absent caches no response at all.
# A response that names its own expiry overrides this: Cache-Control max-age or Expires
# sets the span, and no-store, no-cache or private keeps nothing.
response_ttl = 60

# Standalone deployment caches into a local directory instead, which only a build
# with the standalone-cache feature serves (cargo build --features standalone-cache):
# [cache]
# backend = "sled"
# path = "./intelli-prism-cache"
# response_ttl = 60
# Bytes each level may hold before its least recently used entries go. Absent limits
# nothing, and only the ttls drop anything. Redis enforces no such limit of its own:
# there the server's maxmemory-policy evicts and these would be advisory, so they are
# named here alone.
# response_max_bytes = 268435456
# semantic_max_bytes = 67108864
# system_max_bytes = 16777216

[auth]
# Seconds a nonce stays spent. Default 300.
nonce_ttl = 300

[auth.jwt]
issuer = "intelli-prism"
# At least 32 bytes, or the server refuses to start. Draw it from a random source.
secret = "replace-this-with-32-or-more-random-bytes"
# Seconds a freshly issued token stays valid. Default 21600, six hours.
ttl = 21600

# What is kept of the record of every request.
[usage]
# How long a usage row is kept, in seconds. Unset keeps every row, which is the default:
# what was spent is a business record, and removing one is an operator's decision.
# retention = 2592000
# How often rows past their keeping are swept away. Default one hour.
# sweep_every = 3600

[telemetry]
# trace, debug, info, warn or error. Default info.
log_level = "info"
# A collector reached over grpc. Traces are exported only when this is set.
# otlp_endpoint = "http://localhost:4317/"
# Share of requests whose trace is exported, 0 to 1. Default 1, every request.
# sample_ratio = 1.0

# One block per upstream llm. The id is what routing rules and api capabilities name.
# An upstream standing behind several endpoints adds a [[upstream.target]] block for each one
# beyond base_url, and says how requests are spread with `strategy`:
# round_robin (the default), least_load, or ratio by the `weight` each endpoint carries.
# A `weight` of 0 drains that endpoint: no strategy sends it a request until it is raised again.
# A `hedge` of 2 or 3 races each request across that many of them and keeps the first
# successful answer — a slow endpoint failing does not end the race. A request that cannot be
# sent twice is sent once instead: a body declared too large to hold, a body that declares no
# length, or a file upload. The usage row says how many arms each request took.
# A `hedge_delay` in milliseconds holds each arm until the one before it has been running
# that long; zero, the default, sends them all together.
# A `serves` caps a replica at the hardest class of request it serves, and everything
# easier than it. An endpoint or upstream that names none serves anything, as it always did.
[[upstream]]
id = "anthropic"
base_url = "https://api.anthropic.com/"
api_key = "sk-replace-me"
model = "claude-opus-5"
temperature = 0.7

# Without a route block the key is derived from [server].listen with the id as the
# path root, so the block above answers on http://127.0.0.1:8080/anthropic. Name any
# part here to override it, which a gateway behind a proxy or serving several
# hostnames needs.
# [upstream.route]
# protocol = "https"
# host = "ai.corp.example"
# port = 443
# path = "/chat"

# Classify the opening of turns that name no class — optional. The binary must be
# built with `--features classifier`; a [difficulty] stanza in a build without it
# is refused at startup rather than ignored. The artifact is a directory holding
# model.onnx, tokenizer.json and gate.json; confidence is the margin the top class
# must hold over the runner-up, chosen against the artifact's validation set.
#
# The library key points at the ONNX Runtime shared library when the loader's own
# search cannot find it: this build pairs with ONNX Runtime 1.28.0, the version
# ort 2.0.0-rc.13 was compiled against.
#
# [difficulty]
# artifact = "/var/lib/intelli-prism/difficulty"
# confidence = 0.4

# Ask a larger model what the margin could not call — optional. The question travels
# this gateway's own routing: ask_path is resolved under the hostname the caller
# arrived at, so a gateway serving several hostnames registers this route behind
# each of them. model is whatever that route's endpoints serve, and upstream names
# the declared upstream whose api_key the question presents — naming one upstream
# is deliberate, and a replicated arbitrating route presents that one key.
#
# timeout is a tail latency you are choosing: the opening request of an unsure
# conversation blocks for up to this many seconds — once per conversation, because
# the ruling is remembered — while every later request of that turn pays nothing.
# Refused, slow or incoherent, the request is dispatched unclassified. The config
# accepts 1 to 30 seconds and refuses the rest, because past half a minute the
# wait turns the arbiter into a dependency of serving.
#
# [arbiter]
# model = "claude-opus-5"
# ask_path = "/arbiter"
# upstream = "anthropic"
# timeout = 2
