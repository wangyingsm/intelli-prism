# Copy to intelli-prism.toml and edit. Every key is rejected if misspelled, so a
# typo stops the server rather than silently taking a default.
#
# The gateway keeps /_ip for its own endpoints: /_ip/healthz and /_ip/whoami. No
# routing rule may claim a path under it. Every other path is proxied.

[server]
listen = "127.0.0.1:8080"

# Standalone deployment. The file is created and migrated on first start.
[storage]
backend = "sqlite"
path = "./intelli-prism.db"

# Cluster deployment uses postgres instead, which only a build with the fast-storage
# feature serves (cargo build --features fast-storage):
# [storage]
# backend = "postgres"
# url = "postgres://intelli_prism:secret@localhost/intelli_prism"

# Cluster deployment. Every node shares one redis, which is what a nonce spent on
# one node needs to be spent on all of them.
[cache]
backend = "redis"
url = "redis://localhost:6379"
# Seconds an answered request stays cached, so the same tenant asking the same route the
# same thing is answered without calling the upstream. Absent caches no response at all.
# A response that names its own expiry overrides this: Cache-Control max-age or Expires
# sets the span, and no-store, no-cache or private keeps nothing.
response_ttl = 60

# Standalone deployment caches into a local directory instead, which only a build
# with the standalone-cache feature serves (cargo build --features standalone-cache):
# [cache]
# backend = "sled"
# path = "./intelli-prism-cache"
# response_ttl = 60
# Bytes each level may hold before its least recently used entries go. Absent limits
# nothing, and only the ttls drop anything. Redis enforces no such limit of its own:
# there the server's maxmemory-policy evicts and these would be advisory, so they are
# named here alone.
# response_max_bytes = 268435456
# semantic_max_bytes = 67108864
# system_max_bytes = 16777216

[auth]
# Seconds a nonce stays spent. Default 300.
nonce_ttl = 300

[auth.jwt]
issuer = "intelli-prism"
# At least 32 bytes, or the server refuses to start. Draw it from a random source.
secret = "replace-this-with-32-or-more-random-bytes"
# Seconds a freshly issued token stays valid. Default 21600, six hours.
ttl = 21600

# What is kept of the record of every request.
[usage]
# How long a usage row is kept, in seconds. Unset keeps every row, which is the default:
# what was spent is a business record, and removing one is an operator's decision.
# retention = 2592000
# How often rows past their keeping are swept away. Default one hour.
# sweep_every = 3600

[telemetry]
# trace, debug, info, warn or error. Default info.
log_level = "info"
# A collector reached over grpc. Traces and metrics are both exported only when this
# is set, and the collector forwards them wherever your dashboards live. There is no
# scrape endpoint: nothing new listens, so there is nothing new to guard — and metrics
# carry a tenant label, which is tenant data and not something to serve unauthenticated.
# otlp_endpoint = "http://localhost:4317/"
# Share of requests whose trace is exported, 0 to 1. Default 1, every request.
# Metrics are not sampled: a rate counted from a tenth of the requests is a tenth of
# the rate, and a histogram of a tenth of them has a tenth of its shape.
# sample_ratio = 1.0
#
# What is counted, once a collector is configured:
#
#   ip.requests            answered, by tenant, api, model and where the answer came from
#   ip.tokens              spent, by direction — zero on a cache hit, which is the point
#   ip.latency             end to end, in ms, buckets from 1 ms to a minute
#   ip.classified          by the class dispatched at and the level that named it
#   ip.refused             turned away by a limit, and which quota ran out
#   ip.arms                sent upstream; the gap from ip.requests is what hedging costs
#   ip.redacted            secrets taken out of a request or its answer
#   ip.semantic.lookups    turns at the semantic cache: hit, miss, ineligible, unembedded
#   ip.semantic.nearness   how near the nearest question came, hit or miss
#
# Names are dotted as OpenTelemetry spells them; a collector exporting to Prometheus
# turns ip.requests into ip_requests_total itself.
#
# On cardinality, which is yours to manage: every counter above carries a `tenant`
# label, so each one costs a series per tenant per api. The two histograms do not —
# a histogram costs a series per bucket per label set, which with a tenant would be
# fourteen times more for a question about the deployment rather than any one tenant.
# If your tenant count runs to thousands, the usage rows hold every one of these
# figures per request and are the better place to ask a per-tenant question.

# One block per upstream llm. The id is what routing rules and api capabilities name.
# An upstream standing behind several endpoints adds a [[upstream.target]] block for each one
# beyond base_url, and says how requests are spread with `strategy`:
# round_robin (the default), least_load, or ratio by the `weight` each endpoint carries.
# A `weight` of 0 drains that endpoint: no strategy sends it a request until it is raised again.
# A `hedge` of 2 or 3 races each request across that many of them and keeps the first
# successful answer — a slow endpoint failing does not end the race. A request that cannot be
# sent twice is sent once instead: a body declared too large to hold, a body that declares no
# length, or a file upload. The usage row says how many arms each request took.
# A `hedge_delay` in milliseconds holds each arm until the one before it has been running
# that long; zero, the default, sends them all together.
# A `serves` caps a replica at the hardest class of request it serves, and everything
# easier than it. An endpoint or upstream that names none serves anything, as it always did.
[[upstream]]
id = "anthropic"
base_url = "https://api.anthropic.com/"
api_key = "sk-replace-me"
model = "claude-opus-5"
temperature = 0.7

# Serve callers of one provider family from endpoints that speak another — optional.
# caller_speaks is the family your clients send; upstream_speaks is the family this
# upstream answers in. Naming neither, or naming one family on both sides, forwards
# every body untouched, which is what every upstream did before these keys existed.
#
# A crossing is per upstream, never global: only a declared pair is translated, and
# answers stream across as they arrive, so a client pays no latency for it. The model
# your caller names is carried through and never remapped. What a family cannot
# express is dropped rather than refused, and the answer names it in the
# x-ip-untranslated header. These are keys of the upstream itself, so they go above
# any [upstream.route] block rather than after it.
#
# caller_speaks = "openai"
# upstream_speaks = "anthropic"

# Without a route block the key is derived from [server].listen with the id as the
# path root, so the block above answers on http://127.0.0.1:8080/anthropic. Name any
# part here to override it, which a gateway behind a proxy or serving several
# hostnames needs.
# [upstream.route]
# protocol = "https"
# host = "ai.corp.example"
# port = 443
# path = "/chat"

# Classify the opening of turns that name no class — optional. The binary must be
# built with `--features classifier`; a [difficulty] stanza in a build without it
# is refused at startup rather than ignored. The artifact is a directory holding
# model.onnx, tokenizer.json and gate.json; confidence is the margin the top class
# must hold over the runner-up, chosen against the artifact's validation set.
#
# The library key points at the ONNX Runtime shared library when the loader's own
# search cannot find it: this build pairs with ONNX Runtime 1.28.0, the version
# ort 2.0.0-rc.13 was compiled against.
#
# [difficulty]
# artifact = "/var/lib/intelli-prism/difficulty"
# confidence = 0.4

# Ask a larger model what the margin could not call — optional. The question travels
# this gateway's own routing: ask_path is resolved under the hostname the caller
# arrived at, so a gateway serving several hostnames registers this route behind
# each of them. model is whatever that route's endpoints serve, and upstream names
# the declared upstream whose api_key the question presents — naming one upstream
# is deliberate, and a replicated arbitrating route presents that one key.
#
# timeout is a tail latency you are choosing: the opening request of an unsure
# conversation blocks for up to this many seconds — once per conversation, because
# the ruling is remembered — while every later request of that turn pays nothing.
# Refused, slow or incoherent, the request is dispatched unclassified. The config
# accepts 1 to 30 seconds and refuses the rest, because past half a minute the
# wait turns the arbiter into a dependency of serving.
#
# [arbiter]
# model = "claude-opus-5"
# ask_path = "/arbiter"
# upstream = "anthropic"
# timeout = 2

# What must not leave a request or its answer.
#
# Absent, nothing is looked for and every body travels exactly as it did before this
# existed. Present, every request and every answer is walked, a match is replaced with
# a placeholder such as [redacted:email:1], and the answer carries x-ip-redacted saying
# what was taken.
#
# This is the operator's floor. It is configuration and not a stored rule because a
# tenant must not be able to switch off the filter that stops their own data leaving.
#
# `shipped` names which of the secrets this build carries are in force. Left out, the
# ones whose issuer published a check are used — credit-card, prc-id and iban each
# confirm themselves, so they can be switched on without first measuring what they
# cost in false positives. The rest are named deliberately or not at all:
#
#   private-key  openai-key  github-token  aws-key  google-key
#   slack-token  iban  prc-id  credit-card  email
#
# `window` is how many characters of a streamed answer are held back to be looked at.
# A model writes a secret token by token, so one is only seen by holding text until
# nothing is still growing into a match, and that is paid for in time to first token.
# Zero holds nothing and catches only what arrives whole in one event, which for a
# streamed secret is most often nothing at all.
#
# [filter]
# shipped = ["credit-card", "prc-id", "iban", "private-key", "openai-key"]
# window = 256

# Secrets of your own, recognised four ways: `plain` for the exact text, `prefix` for
# anything beginning with it, `suffix` for anything ending with it, and `regexp`. A
# prefix or a suffix reaches through the whole token, so "MYCORP-" takes the key it
# announced and not the seven characters that announced it. `check` is optional and
# names arithmetic that confirms a match: luhn, prc_id or iban.
#
# [[filter.secret]]
# kind = "corp-token"
# prefix = "MYCORP-"
#
# [[filter.secret]]
# kind = "staff-mail"
# suffix = "@corp.example"
#
# [[filter.secret]]
# kind = "account"
# regexp = '\b[0-9]{13,19}\b'
# check = "luhn"

# What one tenant wants looked for beyond the floor. Added to it, never instead of it:
# a tenant block naming nothing leaves the floor exactly as it was, and there is no way
# to write one that takes anything out of it. That is what makes the floor a floor.
#
# Resolved once at startup, per tenant named here, so a request only ever looks one up.
# A tenant not named here is scanned for the floor.
#
# [[filter.tenant]]
# tenant = "acme"
# shipped = ["email"]
#
# [[filter.tenant.secret]]
# kind = "acme-id"
# prefix = "ACME-"

# Answer a question asked before in other words — optional, and the third cache level.
# The binary must be built with `--features semantic`; a [semantic] stanza in a build
# without it is refused at startup rather than ignored.
#
# Absent, the level holds nothing and no request is ever embedded. Present, it is on
# for every llm route: there is no per-route switch, because what a near miss is worth
# is one judgement about one deployment's traffic.
#
# Three gates bound what it can get wrong, and only one of them is yours to set:
#
#   One question. Only a body holding a single unanswered turn is looked up or kept.
#   In a conversation the context is most of the meaning, so matching on the question
#   alone would answer it out of somebody else's exchange. Agent traffic never touches
#   this level at all.
#
#   One tenant, one route. Every tenant's questions live in an index of that tenant's
#   own, per route, and the stored answer is keyed under both besides.
#
#   Near enough. Yours. There is deliberately no default: this number decides when the
#   gateway hands one caller another caller's answer. Every answer it gives carries
#   x-ip-cache: semantic and x-ip-nearness, so set it high, watch what your own traffic
#   actually scores, and move it against that rather than against a stranger's guess.
#
# Set it high because the floor is high, which is the thing that surprises people.
# Measured on multilingual-e5-small, 384 dimensions, int8:
#
#   two ways of asking one question                0.978
#   the same question in Chinese, not English      0.822
#   two questions with nothing in common           0.762
#
# Unrelated text scores 0.76, not 0.0, so 0.5 would answer very nearly everything out
# of the cache. These are this model's figures and not a law; yours will differ, which
# is what the reported nearness is for. Note the middle row too: at a sane threshold
# the same question in another language is a miss, which is usually right, since the
# answer held for it is in the other language.
#
# artifact is a directory holding model.onnx, tokenizer.json and embed.json, exported
# from a sentence-embedding model — not the difficulty artifact, which answers with
# five logits and no geometry to compare. The manifest carries the width, the pooling
# and the weights' digest, and that digest goes into every key, so replacing the model
# cannot serve an answer found by the old one's geometry.
#
# ttl is how long an answer may stand in for a *different* question, which is usually
# shorter than how long it is good for its own; it is its own span and not the response
# cache's. A response saying no-store is still kept in neither.
#
# capacity is how many questions one tenant holds on one route. A lookup scans them, so
# it is a latency budget as much as a memory one: the default answers in about a
# millisecond, and the ceiling is 65536.
#
# Two things this does not do yet. The index is in memory, in one process, so each node
# learns only from the traffic it has seen and a restart starts over. And a request that
# misses pays one forward pass of the encoder before going upstream, which is the cost
# the hit rate has to earn back.
#
# [semantic]
# artifact = "/var/lib/intelli-prism/embed"
# nearness = 0.97
# ttl = 3600
# capacity = 4096
