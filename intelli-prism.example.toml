# Copy to intelli-prism.toml and edit. Every key is rejected if misspelled, so a
# typo stops the server rather than silently taking a default.
#
# The gateway keeps /_ip for its own endpoints: /_ip/healthz and /_ip/whoami. No
# routing rule may claim a path under it. Every other path is proxied.

[server]
listen = "127.0.0.1:8080"

# Standalone deployment. The file is created and migrated on first start.
[storage]
backend = "sqlite"
path = "./intelli-prism.db"

# Cluster deployment uses postgres instead, which only a build with the fast-storage
# feature serves (cargo build --features fast-storage):
# [storage]
# backend = "postgres"
# url = "postgres://intelli_prism:secret@localhost/intelli_prism"

# Cluster deployment. Every node shares one redis, which is what a nonce spent on
# one node needs to be spent on all of them.
[cache]
backend = "redis"
url = "redis://localhost:6379"

# Standalone deployment caches into a local directory instead, which only a build
# with the standalone-cache feature serves (cargo build --features standalone-cache):
# [cache]
# backend = "sled"
# path = "./intelli-prism-cache"

[auth]
# Seconds a nonce stays spent. Default 300.
nonce_ttl = 300

[auth.jwt]
issuer = "intelli-prism"
# At least 32 bytes, or the server refuses to start. Draw it from a random source.
secret = "replace-this-with-32-or-more-random-bytes"
# Seconds a freshly issued token stays valid. Default 21600, six hours.
ttl = 21600

[telemetry]
# trace, debug, info, warn or error. Default info.
log_level = "info"
# otlp_endpoint = "http://localhost:4317/"

# One block per upstream llm. The id is what routing rules and api capabilities name.
[[upstream]]
id = "anthropic"
base_url = "https://api.anthropic.com/"
api_key = "sk-replace-me"
model = "claude-opus-5"
temperature = 0.7

# Without a route block the key is derived from [server].listen with the id as the
# path root, so the block above answers on http://127.0.0.1:8080/anthropic. Name any
# part here to override it, which a gateway behind a proxy or serving several
# hostnames needs.
# [upstream.route]
# protocol = "https"
# host = "ai.corp.example"
# port = 443
# path = "/chat"
