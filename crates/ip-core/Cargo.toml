[package]
name = "ip-core"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.20"
zeroize = "1.9.0"

[dev-dependencies]
serde_json = "1.0.151"
