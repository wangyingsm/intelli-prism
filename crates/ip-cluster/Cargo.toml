[package]
name = "ip-cluster"
description = "Sending one node of a run graph to another member of this cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# The stub worker in `testing`, which answers a real event stream over a loopback socket. Behind
# a feature rather than `#[cfg(test)]` because the coordinator that dispatches lives in the
# binary and needs a worker to dispatch to, and a double of the client would be a double of the
# thing under test.
testing = ["hyper/server", "dep:futures-util"]

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
  "alloc",
], optional = true }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = [
  "http1",
  "http2",
  "ring",
  "webpki-roots",
  "tls12",
] }
hyper-util = { version = "0.1.20", features = [
  "client-legacy",
  "http1",
  "http2",
  "tokio",
] }
ip-agents = { version = "0.1.0", path = "../ip-agents" }
ip-config = { version = "0.1.0", path = "../ip-config" }
ip-core.workspace = true
ip-graph = { version = "0.1.0", path = "../ip-graph" }
ip-run = { version = "0.1.0", path = "../ip-run" }
rustls = { version = "0.23.44", default-features = false, features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
  "alloc",
] }
hyper = { version = "1.11.1", features = ["server"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
