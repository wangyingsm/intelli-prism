[package]
name = "ip-storage"
description = "Tenants, users, grants, routes and plugins, over sqlite or postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
ip-core = { version = "0.1.0", path = "../ip-core" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "migrate", "macros"], optional = true }
thiserror.workspace = true
typestate-txn = { version = "0.1.0", path = "../typestate-txn" }

[dev-dependencies]
tokio.workspace = true

[features]
default = ["standalone-storage"]
standalone-storage = ["dep:sqlx", "sqlx/sqlite"]
fast-storage = ["dep:sqlx", "sqlx/postgres"]
