[package]
name = "ip-graph"
description = "Run graphs: what a DAG of agent templates is before anything runs one"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
getrandom.workspace = true
hex.workspace = true
ip-agents = { version = "0.1.0", path = "../ip-agents" }
ip-core.workspace = true
ip-drsg = { version = "0.1.0", path = "../ip-drsg" }
ip-run = { version = "0.1.0", path = "../ip-run" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
ip-drsg = { version = "0.1.0", path = "../ip-drsg", features = ["testing"] }
proptest = "1.12.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
