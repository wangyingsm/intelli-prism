[package]
name = "ip-drsg"
description = "A JSON-RPC client for one dr-strange plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# The stub plane in `testing`, which answers real JSON-RPC over a loopback socket. Behind a
# feature rather than `#[cfg(test)]` because `ip-graph`'s tests assert the bodies this crate
# sends, and a double of the client would be a double of the thing under test.
testing = ["hyper/server"]

[dependencies]
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "tls12"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "http2", "tokio"] }
ip-config = { version = "0.1.0", path = "../ip-config" }
ip-retrieve = { version = "0.1.0", path = "../ip-retrieve" }
rustls = { version = "0.23.44", default-features = false, features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
hyper = { version = "1.11.1", features = ["server"] }
