[package]
name = "ip-auth"
description = "Request signatures, nonces and what an identity is allowed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.22.1"
getrandom.workspace = true
hex.workspace = true
hmac = "0.13.0"
ip-cache = { version = "0.1.0", path = "../ip-cache", default-features = false }
ip-core = { version = "0.1.0", path = "../ip-core" }
ip-storage = { version = "0.1.0", path = "../ip-storage", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
ip-cache = { version = "0.1.0", path = "../ip-cache", features = ["standalone-cache", "testing"] }
ip-storage = { version = "0.1.0", path = "../ip-storage", features = ["standalone-storage"] }
