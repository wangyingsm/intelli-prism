[package]
name = "ip-classify"
description = "The arithmetic that turns a distribution over the classes into a class, or into nothing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ip-core.workspace = true
thiserror.workspace = true
# The model, behind `runtime` and never default: a build that does not want a native ONNX
# Runtime must not get one. Everything about loading it lives in that crate, including the
# rule that one process loads one library.
ip-onnx = { version = "0.1.0", path = "../ip-onnx", optional = true }

[features]
default = []
runtime = ["dep:ip-onnx"]
