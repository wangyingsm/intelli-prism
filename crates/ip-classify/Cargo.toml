[package]
name = "ip-classify"
description = "The arithmetic that turns a distribution over the classes into a class, or into nothing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ip-core.workspace = true
thiserror.workspace = true
# The inference runtime, behind `runtime` and never default: a build that does not want a
# native ONNX Runtime must not get one. `load-dynamic` keeps it a runtime find rather than
# a build-time link, so the library ships beside the binary and the crate builds anywhere.
serde_json = { version = "1", optional = true }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"], optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }

[features]
default = []
runtime = ["dep:ort", "dep:tokenizers", "dep:serde_json"]
