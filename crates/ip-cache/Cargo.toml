[package]
name = "ip-cache"
description = "The response, semantic and system caches, over sled or redis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
redis = { version = "1.7.0", default-features = false, features = ["tokio-comp", "connection-manager"], optional = true }
futures-util = { version = "0.3.34", default-features = false, optional = true }
sled = { version = "0.34.7", optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
default = ["cluster-cache"]
testing = []
standalone-cache = ["dep:sled", "dep:tokio"]
cluster-cache = ["dep:redis", "dep:tokio", "dep:futures-util"]
