[package]
name = "ip-cache"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.92"
redis = { version = "1.7.0", default-features = false, features = ["tokio-comp", "connection-manager"], optional = true }
sled = { version = "0.34.7", optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
default = ["cluster-cache"]
standalone-cache = ["dep:sled", "dep:tokio"]
cluster-cache = ["dep:redis"]
