[package]
name = "ip-run"
description = "Running an agent template: what one run of the loop is made of"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
getrandom.workspace = true
hex.workspace = true
http = "1.5.0"
http-body-util = "0.1.5"
ip-agents = { version = "0.1.0", path = "../ip-agents" }
ip-auth = { version = "0.1.0", path = "../ip-auth" }
ip-core = { version = "0.1.0", path = "../ip-core" }
ip-gateway = { version = "0.1.0", path = "../ip-gateway" }
ip-mcp = { version = "0.1.0", path = "../ip-mcp" }
ip-protocol = { version = "0.1.0", path = "../ip-protocol" }
ip-retrieve = { version = "0.1.0", path = "../ip-retrieve" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
async-trait = "0.1.92"
hyper = { version = "1.11.1", features = ["server"] }
hyper-util = { version = "0.1.19", features = ["tokio"] }
ip-config = { version = "0.1.0", path = "../ip-config" }
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
] }
